name: Generate profile graphics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml
      - scripts/generate_activity_graph.py
      - tests/test_activity_graph.py
      - scripts/generate_languages.py
      - tests/test_languages.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Test activity graph generator
        run: python3 -m unittest discover -s tests -v

      - name: Generate activity graph SVGs
        run: python3 scripts/generate_activity_graph.py --username "$PROFILE_OWNER"
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate language SVGs
        run: python3 scripts/generate_languages.py --username "$PROFILE_OWNER"
        env:
          PROFILE_OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate light streak SVG
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: user=${{ github.repository_owner }}&theme=default&date_format=M%20j%5B%2C%20Y%5D&card_width=440
          path: dist/github-streak-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dark streak SVG
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: user=${{ github.repository_owner }}&theme=gotham&date_format=M%20j%5B%2C%20Y%5D&card_width=440
          path: dist/github-streak-stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
